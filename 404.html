<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Page not found · B.G. Towing &amp; Repair</title>
<meta name="theme-color" content="#0B0D0F">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230B0D0F'/><path d='M6 22h20M9 22v-4h6l2-5h4l4 5v4' stroke='%23F5A524' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{
  color-scheme:dark;
  --asphalt:#0B0D0F; --steel:#14181B; --line:#2A3238; --line-2:#394349;
  --signal:#F1F4F5; --conc:#9AA6AD;
  --amber:#F5A524; --amber-hi:#FFBB4D; --on-amber:#140E02;
  --display:"Archivo",ui-sans-serif,system-ui,Arial,sans-serif;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--asphalt);color:var(--signal);font-family:var(--sans);
  display:grid;place-items:center;text-align:center;
  padding:40px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px));
  -webkit-font-smoothing:antialiased
}
.box{max-width:30rem;display:flex;flex-direction:column;align-items:center;gap:20px}
.code{font-family:var(--mono);font-size:.78rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--amber)}
h1{
  margin:0;font-family:var(--display);font-weight:800;text-transform:uppercase;
  font-size:clamp(2rem,8vw,3.1rem);line-height:1.04;letter-spacing:-.03em;text-wrap:balance
}
p{margin:0;color:var(--conc);font-size:1.02rem;line-height:1.6}
.row{display:flex;flex-wrap:wrap;gap:11px;justify-content:center;margin-top:6px}
.btn{
  display:inline-flex;align-items:center;gap:9px;padding:15px 24px;border-radius:11px;
  background:var(--amber);color:var(--on-amber);text-decoration:none;
  font-family:var(--display);font-weight:700;font-size:1rem;
  box-shadow:0 10px 26px rgba(245,165,36,.22);transition:transform .16s,background-color .2s
}
.btn:hover{transform:translateY(-2px);background:var(--amber-hi)}
.btn.ghost{background:transparent;color:var(--signal);border:1.5px solid var(--line-2);box-shadow:none}
.btn.ghost:hover{border-color:var(--conc);background:var(--steel)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
  <main class="box">
    <p class="code">Error 404</p>
    <h1>That page isn't here.</h1>
    <p>The link may be old or mistyped. If you're broken down right now, don't hunt
      around the site — just call. The line is answered around the clock.</p>
    <div class="row">
      <a class="btn" href="tel:+14193522626">Call <span class="num">(419)&nbsp;352-2626</span></a>
      <a class="btn ghost" href="./">Back to the home page</a>
    </div>
  </main>
</body>
</html>
